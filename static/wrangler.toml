# Cloudflare Pages project config for qrinfo.
#
# This file lets `wrangler pages deploy` (and `wrangler pages dev`) resolve the
# build output dir and the Functions directory deterministically, instead of
# depending on the current working directory. Run wrangler from `static/`.
#
# Layout (file-based Functions are a SIBLING of the output dir, both under static/):
#   static/
#   ├── wrangler.toml          ← this file
#   ├── dist/                  ← pages_build_output_dir (built by `npm run build`)
#   └── functions/             ← Pages Functions (compiled by wrangler on deploy)
#       ├── _lib/scan-event.mjs
#       └── q/[customerId]/[qid].js
#
# NOTE: keep `functions/` OUT of `dist/` — the build wipes dist/ each run, and CF
# guidance is that functions/ must not live inside the static output root.

name = "qrinfo"
pages_build_output_dir = "./dist"
compatibility_date = "2026-06-01"

# Workers Analytics Engine — one data point per QR scan, written by
# functions/q/[customerId]/[qid].js via env.SCANS. The dataset auto-creates on
# first write. The admin stats view queries this same dataset over the SQL API.
[[analytics_engine_datasets]]
binding = "SCANS"
dataset = "qrinfo_scans"

# env.ASSETS (the static-asset fetcher) is provided automatically for Pages
# Functions — no binding declaration needed.

# QRINFO_ENV labels scan events. Set the production value in the CF Pages project
# (Settings > Environment variables) per branch; this is just the local default.
[vars]
QRINFO_ENV = "local"
# Account id for the /stats page's WAE SQL query (not secret — appears in
# dashboard URLs). The matching token is a secret: `wrangler pages secret put
# WAE_SQL_TOKEN`. Both are read by functions/_lib/wae-query.mjs.
CF_ACCOUNT_ID = "bf81aa0d612777a0d69cf259b0dbf94c"
